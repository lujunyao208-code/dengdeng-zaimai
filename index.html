<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e7">
  <title>等等再买 · 给冲动一点时间</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a6134' stroke-width='1.6' stroke-linecap='round'%3E%3Crect width='24' height='24' rx='6' fill='%23f7f2e7' stroke='none'/%3E%3Ccircle cx='12' cy='12' r='2.2'/%3E%3Cellipse cx='12' cy='5.6' rx='1.9' ry='3'/%3E%3Cellipse cx='12' cy='18.4' rx='1.9' ry='3'/%3E%3Cellipse cx='5.6' cy='12' rx='3' ry='1.9'/%3E%3Cellipse cx='18.4' cy='12' rx='3' ry='1.9'/%3E%3C/svg%3E">
  <!-- 字体：Apple 系统字体栈（无网络字体，见 styles.css） -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="phone-frame">
    <!-- 页面内容渲染区 -->
    <main id="app"></main>

    <!-- 底部导航：我的物品 ｜ ＋添加新物品 ｜ 我的 -->
    <nav class="tabbar" id="tabbar" aria-label="底部导航">
      <button class="tab" data-route="items">
        <span class="tab-icon ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.6 5.3 8.6 4.5 6 4.5v14c2.6 0 4.6.8 6 2 1.4-1.2 3.4-2 6-2v-14c-2.6 0-4.6.8-6 2z"/><path d="M12 6.5v14"/></svg></span>
        <span class="tab-label">我的物品</span>
      </button>
      <button class="tab tab-add" data-route="add" aria-label="添加新物品">
        <span class="tab-add-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
      </button>
      <button class="tab" data-route="profile">
        <span class="tab-icon ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c1.2-3.4 3.6-5 6.5-5s5.3 1.6 6.5 5"/></svg></span>
        <span class="tab-label">我的</span>
      </button>
    </nav>
  </div>

  <!-- 全局提示 -->
  <div id="toast" class="toast" role="status"></div>
  <!-- 底部弹出层（编辑资料 / 确认框等） -->
  <div id="sheet-root"></div>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/items.js"></script>
  <script src="js/pages/add.js"></script>
  <script src="js/pages/detail.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
